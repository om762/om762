<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&amp;display=swap');
      .num { font-family: 'Caveat', 'Segoe Print', cursive; font-size: 36px; font-weight: 700; fill: #c6f135; }
      .principle { font-family: 'Caveat', 'Segoe Print', cursive; font-size: 22px; fill: #f2ede4; }
      .small-note { font-family: 'Caveat', 'Segoe Print', cursive; font-size: 14px; fill: #666; }
      .card-bg { fill: #161b22; }
      .card-border { fill: none; stroke: #2a2a2a; stroke-width: 1; }
      .accent-line { stroke: #c6f135; stroke-width: 2; stroke-linecap: round; }
      .doodle { stroke: #555; stroke-width: 1.5; fill: none; stroke-linecap: round; }
      .cross { stroke: #c6f135; stroke-width: 1.5; fill: none; stroke-linecap: round; opacity: 0.4; }
    </style>
  </defs>

  <!-- Card 1: solve the annoying thing -->
  <g transform="translate(10, 12) rotate(-1.2, 130, 120)">
    <rect width="270" height="236" class="card-bg" rx="8"/>
    <rect width="270" height="236" class="card-border" rx="8"/>
    <!-- tape -->
    <rect x="105" y="-6" width="56" height="16" rx="3" fill="#c6f135" opacity="0.12"/>
    <rect x="105" y="-6" width="56" height="16" rx="3" fill="none" stroke="#c6f135" stroke-width="0.5" opacity="0.25"/>
    <text x="28" y="55" class="num">01</text>
    <line x1="28" y1="63" x2="68" y2="63" class="accent-line" stroke-dasharray="6 3"/>
    <text x="28" y="100" class="principle">solve the</text>
    <text x="28" y="130" class="principle">annoying thing</text>
    <text x="28" y="175" class="small-note">not the theoretical thing.</text>
    <text x="28" y="193" class="small-note">the thing that actually</text>
    <text x="28" y="211" class="small-note">bothers you.</text>
    <path d="M 195 210 Q 210 200, 225 213" class="doodle"/>
    <path d="M 221 207 L 225 213 L 218 213" class="doodle"/>
  </g>

  <!-- Card 2: hide complexity -->
  <g transform="translate(305, 8)">
    <rect width="270" height="240" class="card-bg" rx="8"/>
    <rect width="270" height="240" class="card-border" rx="8"/>
    <rect x="100" y="-6" width="66" height="16" rx="3" fill="#c6f135" opacity="0.12"/>
    <rect x="100" y="-6" width="66" height="16" rx="3" fill="none" stroke="#c6f135" stroke-width="0.5" opacity="0.25"/>
    <text x="28" y="55" class="num">02</text>
    <line x1="28" y1="63" x2="68" y2="63" class="accent-line" stroke-dasharray="6 3"/>
    <text x="28" y="100" class="principle">hide complexity</text>
    <text x="28" y="130" class="principle">until it's needed</text>
    <text x="28" y="175" class="small-note">features appear when useful,</text>
    <text x="28" y="193" class="small-note">not because they exist.</text>
    <circle cx="225" cy="215" r="8" class="doodle"/>
    <circle cx="225" cy="215" r="3" fill="#c6f135" opacity="0.25"/>
  </g>

  <!-- Card 3: make the final thing better -->
  <g transform="translate(600, 14) rotate(0.8, 130, 120)">
    <rect width="270" height="236" class="card-bg" rx="8"/>
    <rect width="270" height="236" class="card-border" rx="8"/>
    <rect x="95" y="-6" width="76" height="16" rx="3" fill="#c6f135" opacity="0.12"/>
    <rect x="95" y="-6" width="76" height="16" rx="3" fill="none" stroke="#c6f135" stroke-width="0.5" opacity="0.25"/>
    <text x="28" y="55" class="num">03</text>
    <line x1="28" y1="63" x2="68" y2="63" class="accent-line" stroke-dasharray="6 3"/>
    <text x="28" y="100" class="principle">make the final</text>
    <text x="28" y="130" class="principle">thing better</text>
    <text x="28" y="160" class="principle">than the first idea</text>
    <text x="28" y="200" class="small-note">don't just make it work.</text>
    <text x="28" y="218" class="small-note">make it right.</text>
    <text x="155" y="218" class="small-note" opacity="0.4">good enough</text>
    <line x1="153" y1="214" x2="243" y2="214" class="cross"/>
  </g>
</svg>
