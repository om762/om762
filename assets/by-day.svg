<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&amp;display=swap');
      .label { font-family: 'Caveat', 'Segoe Print', cursive; font-size: 18px; fill: #f2ede4; text-anchor: middle; }
      .label-sm { font-family: 'Caveat', 'Segoe Print', cursive; font-size: 14px; fill: #888; text-anchor: middle; }
      .label-accent { font-family: 'Caveat', 'Segoe Print', cursive; font-size: 18px; fill: #c6f135; text-anchor: middle; font-weight: 700; }
      .box { fill: #161b22; stroke: #333; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .box-accent { fill: #161b22; stroke: #c6f135; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { stroke: #555; stroke-width: 1.5; fill: none; stroke-linecap: round; marker-end: url(#arrowhead); }
      .arrow-accent { stroke: #c6f135; stroke-width: 1.5; fill: none; stroke-linecap: round; marker-end: url(#arrowhead-accent); }
      .note { font-family: 'Caveat', 'Segoe Print', cursive; font-size: 13px; fill: #555; }
      .stack-text { font-family: 'Caveat', 'Segoe Print', cursive; font-size: 14px; fill: #666; text-anchor: middle; }
      .desc-text { font-family: 'Caveat', 'Segoe Print', cursive; font-size: 13px; fill: #555; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6" fill="none" stroke="#555" stroke-width="1.2"/>
    </marker>
    <marker id="arrowhead-accent" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6" fill="none" stroke="#c6f135" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Source systems -->
  <g transform="translate(55, 40)">
    <rect x="4" y="4" width="100" height="55" rx="5" class="box" opacity="0.4"/>
    <rect x="8" y="8" width="100" height="55" rx="5" class="box" opacity="0.6"/>
    <rect x="0" y="0" width="100" height="55" rx="5" class="box"/>
    <text x="50" y="22" class="label">different</text>
    <text x="50" y="42" class="label">sources</text>
  </g>
  <text x="105" y="125" class="label-sm">SQL, APIs, files...</text>

  <!-- Arrow 1 -->
  <path d="M 172 70 Q 210 67, 230 70" class="arrow"/>

  <!-- Ingestion -->
  <g transform="translate(238, 40)">
    <rect x="0" y="0" width="110" height="55" rx="5" class="box"/>
    <text x="55" y="22" class="label">migration</text>
    <text x="55" y="42" class="label-sm">&amp; ingestion</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 355 70 Q 390 65, 415 70" class="arrow"/>

  <!-- Processing / Databricks -->
  <g transform="translate(420, 33)">
    <rect x="0" y="0" width="130" height="68" rx="6" class="box-accent"/>
    <text x="65" y="28" class="label-accent">Databricks</text>
    <text x="65" y="48" class="label-sm">lakehouse</text>
  </g>

  <!-- Branching arrows -->
  <path d="M 555 56 Q 580 50, 600 46" class="arrow-accent"/>
  <path d="M 555 78 Q 580 85, 600 90" class="arrow-accent"/>

  <!-- Spark -->
  <g transform="translate(608, 24)">
    <rect x="0" y="0" width="80" height="42" rx="5" class="box"/>
    <text x="40" y="28" class="label">Spark</text>
  </g>

  <!-- SQL -->
  <g transform="translate(608, 74)">
    <rect x="0" y="0" width="80" height="42" rx="5" class="box"/>
    <text x="40" y="28" class="label">SQL</text>
  </g>

  <!-- Merge arrows -->
  <path d="M 694 46 Q 712 58, 718 68" class="arrow"/>
  <path d="M 694 94 Q 712 82, 718 72" class="arrow"/>

  <!-- Useful data -->
  <g transform="translate(722, 50)">
    <rect x="0" y="0" width="68" height="38" rx="5" fill="none" stroke="#c6f135" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="34" y="16" class="label-sm" fill="#c6f135">useful</text>
    <text x="34" y="32" class="label-sm" fill="#c6f135">data</text>
  </g>

  <!-- Lime underline beneath pipeline -->
  <line x1="55" y1="130" x2="790" y2="130" stroke="#c6f135" stroke-width="1" opacity="0.15"/>

  <!-- Tech labels below -->
  <text x="450" y="160" class="stack-text">
    Databricks · Azure · Azure Data Factory · PySpark · Spark SQL · Python · SQL
  </text>
  <text x="450" y="185" class="desc-text">
    data migration &amp; data engineering in a Data + AI environment.
  </text>

  <!-- coffee doodle corner -->
  <g transform="translate(820, 170)">
    <ellipse cx="20" cy="15" rx="14" ry="10" stroke="#333" stroke-width="1" fill="none"/>
    <path d="M 34 10 Q 42 10, 42 15 Q 42 20, 34 20" stroke="#333" stroke-width="1" fill="none"/>
    <path d="M 16 4 Q 14 -2, 18 -6" stroke="#444" stroke-width="0.8" fill="none" opacity="0.4"/>
    <path d="M 24 4 Q 22 -4, 26 -8" stroke="#444" stroke-width="0.8" fill="none" opacity="0.4"/>
  </g>
</svg>
