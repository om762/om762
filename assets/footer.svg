<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 140" width="1400" height="140">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&amp;display=swap');
      .footer-status { font-family: 'Caveat', 'Segoe Print', cursive; font-size: 22px; fill: #c6f135; font-weight: 600; font-style: italic; }
      .footer-name { font-family: 'Caveat', 'Segoe Print', cursive; font-size: 15px; fill: #555; }
      .footer-line { stroke: #222; stroke-width: 1; stroke-linecap: round; }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor { animation: blink 1.2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Top divider line, hand-drawn feel -->
  <path d="M 300 16 Q 500 14, 700 16 Q 900 18, 1100 16" class="footer-line" fill="none"/>

  <!-- Coffee cup doodle -->
  <g transform="translate(640, 42)">
    <ellipse cx="20" cy="22" rx="16" ry="11" stroke="#f2ede4" stroke-width="1.5" fill="none" opacity="0.25"/>
    <path d="M 36 17 Q 45 17, 45 22 Q 45 27, 36 27" stroke="#f2ede4" stroke-width="1.2" fill="none" opacity="0.25"/>
    <!-- steam -->
    <path d="M 14 10 Q 12 2, 16 -4" stroke="#f2ede4" stroke-width="0.8" fill="none" opacity="0.15"/>
    <path d="M 22 10 Q 20 0, 24 -6" stroke="#f2ede4" stroke-width="0.8" fill="none" opacity="0.15"/>
  </g>

  <!-- Status text -->
  <text x="700" y="86" text-anchor="middle" class="footer-status">desk status: still building</text>

  <!-- Blinking cursor -->
  <rect x="862" y="71" width="2" height="18" fill="#c6f135" class="cursor" rx="1"/>

  <!-- Name and year -->
  <text x="700" y="118" text-anchor="middle" class="footer-name">Omprakash Rawat, 2026</text>
</svg>
